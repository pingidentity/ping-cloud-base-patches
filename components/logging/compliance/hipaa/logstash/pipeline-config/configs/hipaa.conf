input {
  http {
    port => 8086
    codec => json
  }
}

filter {
  # Remove transport/internal metadata that is not part of the original PF/PA/PD audit log:
  # - headers: HTTP request metadata added by the Logstash http input.
  # - _p: CRI parser partial/full-line marker; HIPAA only needs the original app log in [log].
  # - date: Fluent Bit transport timestamp, duplicative of [time], [@timestamp], and the app timestamp inside [log].
  # - @version: Logstash internal event version field.
  mutate {
    remove_field => ["headers", "_p", "date", "@version"]
  }

  # PF, PA, and PD container log records from Fluent Bit carry the original app log line in [log].
  # If [log] is missing or empty, this is not a valid HIPAA app log event for this pipeline.
  if ![log] or [log] == "" {
    drop {}
  }

  # Parse [log] JSON into @metadata for validation only.
  json {
    source => "log"
    target => "[@metadata][hipaa_log]"
    skip_on_invalid_json => true
  }

  # Defense-in-depth after the Fluent Bit grep: verify parsed PF/PA log_name values before writing to S3.
  if [@metadata][hipaa_log][log_name] {
    if !([@metadata][hipaa_log][log_name] =~ /^(audit|provisioner|admin-api|admin|pingaccess_api_audit|pingaccess_engine_audit|pingaccess_agent_audit|pingaccess_sideband_audit|pingaccess_sideband_client_audit)$/) {
      drop {}
    }
  }
  # Defense-in-depth after the Fluent Bit grep: PD access events identify by logType before normal Logstash processing would map them to pd-access.
  else if [@metadata][hipaa_log][logType] {
    if [@metadata][hipaa_log][logType] != "access" {
      drop {}
    }
  }
  # Drop records that did not parse to an expected HIPAA routing key.
  else {
    drop {}
  }
}

output {
  s3 {
    region => "${AWS_REGION}"
    bucket => "${HIPAA_BUCKET_NAME}"
    # HIPAA uses a fixed S3 key segment, so no per-event metadata field is needed for the prefix.
    prefix => "hipaa/%{+YYYY}/%{+MM}/%{+dd}/%{+HH}/%{+mm}"
    # Disable the S3 startup write probe that creates logstash-programmatic-access-test-object-* at the bucket root.
    # Actual uploads still require IAM write permission to the configured HIPAA prefix below.
    validate_credentials_on_root_bucket => false
    time_file => "3"
    # Flush logs to S3 when file size reaches 100 MB (104857600 bytes)
    size_file => "104857600"
    # json_lines warns when this is unset because its current 512 MB default will change.
    # 20 MB is above Fluent Bit's 8 MB Buffer_Max_Size, so expected events pass while oversized lines stay bounded.
    codec => json_lines {
      decode_size_limit_bytes => "20971520"
    }
    id => "hipaa_s3_out"
  }
}
