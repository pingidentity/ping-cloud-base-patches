# =============================================================================
# pipeline-hipaa.conf
# HIPAA-specific Fluent Bit pipeline
# =============================================================================

[INPUT]
    Name                tail
    Tag                 elk.hipaa.general.*
    Path                /var/log/containers/*_ping-cloud_*pingfederate*.log, /var/log/containers/*_ping-cloud_*pingdirectory*.log, /var/log/containers/*_ping-cloud_*pingaccess*.log
    Exclude_Path        /var/log/containers/p14c-*.log, *pingcloud-metadata*.log
    multiline.parser    docker, cri
    DB                  /fluent-bit/state/flb_hipaa_ping.db
    Skip_Long_Lines     Off
    Refresh_Interval    20
    Rotate_Wait         10
    Buffer_Chunk_Size   2M
    Buffer_Max_Size     8M
    Mem_Buf_Limit       8M
    storage.type        filesystem
    storage.pause_on_chunks_overlimit on
    Read_from_Head      ${READ_FROM_HEAD}

# Keep HIPAA-relevant PingFederate, PingDirectory, and PingAccess JSON logs.
[FILTER]
    Name                grep
    Match               elk.hipaa.general.*
    # PF/PA audit logs identify by log_name; PD access logs identify by logType before Logstash would map them to pd-access.
    Regex               log (log_name"\s*:\s*"(audit|provisioner|admin-api|admin|pingaccess_api_audit|pingaccess_engine_audit|pingaccess_agent_audit|pingaccess_sideband_audit|pingaccess_sideband_client_audit)"|logType"\s*:\s*"access")

[OUTPUT]
    Name                http
    Alias               hipaa_logstash_out
    Match               elk.hipaa.general.*
    workers             1
    Host                logstash-elastic-compliance.elastic-stack-logging
    Port                8086
    Format              json
    Retry_Limit         15
    compress            gzip
    net.keepalive_idle_timeout  10
    net.keepalive_max_recycle   30
    storage.total_limit_size    1G
