# =============================================================================
# pipeline-lake.conf
# DataLake-specific Fluent Bit pipeline for PingFederate audit logs only.
# =============================================================================

[INPUT]
    Name                tail
    Tag                 elk.lake.general.*
    Path                /var/log/containers/pingfederate-[0-9]*_ping-cloud_pingfederate-[0-9a-f]*.log
    multiline.parser    docker, cri
    DB                  /fluent-bit/state/flb_lake_ping.db
    Skip_Long_Lines     Off
    Refresh_Interval    20
    Rotate_Wait         10
    Buffer_Chunk_Size   2M
    Buffer_Max_Size     8M
    Mem_Buf_Limit       8M
    storage.type        filesystem
    storage.pause_on_chunks_overlimit on
    Read_from_Head      ${READ_FROM_HEAD}

# Keep only PingFederate audit JSON lines (cheap text check, fast reject).
[FILTER]
    Name                grep
    Match               elk.lake.general.*
    Regex               log log_name"\s*:\s*"audit"

[OUTPUT]
    Name                http
    Alias               lake_logstash_out
    Match               elk.lake.general.*
    workers             1
    Host                logstash-elastic-compliance.elastic-stack-logging
    Port                8085
    Format              json
    Retry_Limit         15
    compress            gzip
    net.keepalive_idle_timeout  10
    net.keepalive_max_recycle   30
    storage.total_limit_size    1G
