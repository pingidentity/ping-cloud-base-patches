apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # The ingress-nginx controller's config re-indenter (cleanConf in internal/ingress/controller/template/template.go)
  # treats '#' as a comment marker even inside Lua long-bracket ([[ ]]) strings. The maintenance-mode
  # HTML page in the public location-snippet contained '#' CSS hex colors, so every rendered server block
  # leaked +1 indentation level. Indentation depth scales with ingress host count, and once the indented
  # access_by_lua_block exceeds nginx's 4096-byte config token buffer, every reload fails with
  # "[emerg] Lua code block missing the closing long bracket ]]". Replacing hex colors with rgb() values
  # removes the '#' characters from the Lua string, so the re-indenter's depth tracking stays correct.
  # Original defect: PDO-12367
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nginx-configuration
        namespace: ingress-nginx-public
      data:
        location-snippet: |
          # location-snippet allows you to override all location directives in nginx
          # https://docs.nginx.com/nginx-ingress-controller/configuration/global-configuration/configmap-resource/#snippets-and-custom-templates

          # Block PingAccess and PingFederate heartbeat endpoints.
          # Only block successful 200 status codes. Do nothing in the event of an error.
          if ($request_uri ~* "^/(pa|pf)/heartbeat.ping") {
            header_filter_by_lua_block {
              if ngx.status == ngx.HTTP_OK then
                ngx.header.content_length = nil
              end
            }
            body_filter_by_lua_block {
              if ngx.status == ngx.HTTP_OK then
                ngx.arg[1] = '{}'  -- Replace the response body with an empty JSON object
                ngx.arg[2] = true  -- Indicate that this is the last chunk within response body
              end
            }
          }

          # Maintenance Mode Enforcement for Admin Interfaces
          access_by_lua_block {
            -- Read maintenance-mode flag from file
            local f = io.open("/etc/nginx/maintenance-mode/maintenance-mode", "r")
            local m = f and f:read("*a") or ""
            if f then f:close() end

            -- Get the request host and check if it’s one of the admin interfaces
            local h = ngx.var.host or ""
            local is_admin = h:match("pingfederate%-admin") or h:match("pingaccess%-admin") or h:match("pingaccess%-was%-admin") or h:match("self%-service")

            -- If maintenance mode is enabled and request is for an admin host, return 403 with a friendly page
            if m:find("enabled") and is_admin then
              ngx.status = 403
              ngx.header.content_type = "text/html"
              ngx.say([[
                <!DOCTYPE html>
                <html>
                <head>
                  <title>Maintenance Mode</title>
                  <style>
                    body { font-family: sans-serif; text-align: center; padding-top: 10%; background-color: rgb(247,247,247); color: rgb(51,51,51); }
                    h1 { font-size: 2em; }
                    p { font-size: 1.2em; }
                  </style>
                </head>
                <body>
                  <h1>Maintenance in Progress</h1>
                  <p>Access to the admin interface is temporarily restricted due to scheduled maintenance.</p>
                  <p>Please try again later.</p>
                </body>
                </html>
              ]])
              return ngx.exit(403)
            end
          }
