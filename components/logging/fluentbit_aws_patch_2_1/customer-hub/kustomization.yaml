apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

generatorOptions:
  disableNameSuffixHash: true
  labels:
    k8s-app: fluent-bit

configMapGenerator:
  # Using customer-hub-specific S3 ConfigMap so CSR disable-opensearch
  # patches do not alter this S3-only pipeline.
  - name: fluent-bit-pipeline-s3-customer-hub
    namespace: elastic-stack-logging
    files:
      - s3.conf          

patchesStrategicMerge:
  - fluentbit-config-patch.yaml
  - fluentbit-patch.yaml
  - fluentbit-metrics-patch.yaml
