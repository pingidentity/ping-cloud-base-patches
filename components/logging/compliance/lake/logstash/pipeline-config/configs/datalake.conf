input {
  http {
    port => 8085
    codec => json
  }
}

filter {
  # Remove HTTP request metadata added by the Logstash http input.
  mutate {
    remove_field => ["headers"]
  }

  # Fluent Bit keeps the original container log in [log]; parse it here so this
  # pipeline does not depend on a Fluent Bit parser being loaded.
  if [log] {
    json {
      source => "log"
      skip_on_invalid_json => true
    }
  }

  # Only process PF audit logs
  if ![log_name] or [log_name] != "audit" {
    drop {}
  }

  ### Promote required schema fields from the parsed audit JSON
  mutate {
    rename => {
      "timestamp"    => "Timestamp"
      "event"        => "EventType"
      "subject"      => "UserId"
      "connectionId" => "ConnectionId"
    }
  }

  # Drop events without a usable user identifier
  mutate {
    strip => ["UserId"]
  }
  if ![UserId] or [UserId] == "" {
    drop {}
  }

  # Hash PII fields in place
  fingerprint {
    source => "UserId"
    target => "UserId"
    method => "SHA256"
  }
  fingerprint {
    source => "ConnectionId"
    target => "ConnectionId"
    method => "SHA256"
  }

  # Add enrichment fields
  mutate {
    add_field => {
      "Product"      => "PingFederate"
      "Environment" => "${ENV:}"
    }
  }

  # Stamp SalesforceId from the CUSTOMER_METADATA env var (bootstrap-created
  # customer-metadata ConfigMap): pingCustomerId unless absent/empty/NA, else dnsName.
  # Validated once at boot; unusable metadata fails startup rather than emitting
  # unattributed compliance rows.
  ruby {
    id => "datalake_salesforce_id"
    init => '
      require "json"
      begin
        m = JSON.parse(ENV["CUSTOMER_METADATA"].to_s)
        c = m["customer-metadata"].is_a?(Hash) ? m["customer-metadata"] : m
        v = c["pingCustomerId"]
        v = c["dnsName"] if !v.is_a?(String) || v.strip.empty? || v == "NA"
        raise "neither pingCustomerId nor dnsName is set" unless v.is_a?(String) && !v.strip.empty?
        @salesforce_id = v
      rescue StandardError => e
        raise LogStash::ConfigurationError,
              "SalesforceId enrichment disabled: CUSTOMER_METADATA is unusable (#{e.message}). " \
              "Check the /pcpt/customer/customer-metadata SSM param and the customer-metadata ConfigMap."
      end
    '
    code => 'event.set("SalesforceId", @salesforce_id)'
  }

  ### Keep only final lake schema fields
  prune {
    whitelist_names => ["@timestamp", "Timestamp", "EventType", "UserId", "ConnectionId", "Product", "SalesforceId", "Environment"]
  }
}

output {
  s3 {
    region => "${AWS_REGION}"
    bucket => "${TELEMETRY_BUCKET_NAME}"
    prefix => "p1as-pingfederate/${TELEMETRY_BUCKET_NAME}/%{+YYYY}/%{+MM}/%{+dd}"
    # Disable the S3 startup write probe that creates logstash-programmatic-access-test-object-* at the bucket root.
    # Actual uploads still require IAM write permission to the configured DataLake prefix below.
    validate_credentials_on_root_bucket => false
    time_file => "3"
    size_file => "104857600"
    # json_lines warns when this is unset because its current 512 MB default will change.
    # 20 MB is above Fluent Bit's 8 MB Buffer_Max_Size, so expected events pass while oversized lines stay bounded.
    codec => json_lines {
      decode_size_limit_bytes => "20971520"
    }
    id => "datalake_s3_out"
    # Buffer temp files on PV-backed path so they survive pod restarts.
    # On pod restart, restore=>true uploads leftover temp files before processing new events.
    temporary_directory => "/data/pq/datalake-s3-tmp"
    restore => true
  }
}
