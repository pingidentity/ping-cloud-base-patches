    DB                  /fluent-bit/state/flb_s3_prometheus.db
    Skip_Long_Lines     Off
    Refresh_Interval    10
    Rotate_Wait         15
    storage.type        filesystem
    storage.pause_on_chunks_overlimit on
    Read_from_Head      ${READ_FROM_HEAD}

